services:
  postgres:
    image: postgres:17-alpine
    container_name: sinapse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sinapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sinapse}
      POSTGRES_DB: ${POSTGRES_DB:-sinapse}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - sinapse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sinapse} -d ${POSTGRES_DB:-sinapse}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sinapse-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - sinapse-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sinapse-postgres-data:
  sinapse-redis-data:
