services:
  postgres:
    image: postgres:17-alpine
    container_name: sinapse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sinapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sinapse}
      POSTGRES_DB: ${POSTGRES_DB:-sinapse}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - sinapse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sinapse} -d ${POSTGRES_DB:-sinapse}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sinapse-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - sinapse-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: sinapse-minio
    restart: unless-stopped
    # O bucket padrao (sinapse-dev) e criado pelo servico minio-setup abaixo.
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-sinapse}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-troque_esta_senha_local}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - sinapse-minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-setup:
    image: quay.io/minio/mc:latest
    container_name: sinapse-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-sinapse} ${S3_SECRET_ACCESS_KEY:-troque_esta_senha_local} &&
        mc mb --ignore-existing local/${S3_BUCKET:-sinapse-dev}
      "

volumes:
  sinapse-postgres-data:
  sinapse-redis-data:
  sinapse-minio-data:
